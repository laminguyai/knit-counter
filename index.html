<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="金金哥計算器">
<meta name="theme-color" content="#F7F2E4">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-64.png">
<title>金金哥計算器</title>
<style>
  :root {
    --cream: #F7F2E4;
    --ink: #201D17;
    --muted: #8B8574;
    --yellow: #F2E35C;
    --green: #A9BC6B;
    --pink: #F2BFDC;
    --blue: #AFCDF3;
    --surface: #FCFAF2;
    --hairline: #E5DEC9;
    --red: #C64B57;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang HK", "PingFang TC", sans-serif;
    background: var(--cream);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 20px calc(env(safe-area-inset-bottom, 0px) + 22px);
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
  }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 14px 0 4px;
  }
  .left-col {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }
  .dir-switch {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1.5px solid var(--hairline);
    border-radius: 14px;
    overflow: hidden;
  }
  .dir-key {
    width: 52px;
    height: 44px;
    border: none;
    background: transparent;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.15s;
  }
  .dir-key.on { background: var(--blue); }
  .dir-key:active { transform: scale(0.94); }
  .dir-divider { height: 1.5px; background: var(--hairline); }
  .row-area {
    display: flex;
    align-items: center;
    min-height: 48px;
  }
  .row-chip {
    border: 1.5px solid var(--hairline);
    background: var(--surface);
    color: var(--ink);
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    padding: 8px 16px;
    min-height: 48px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    touch-action: manipulation;
  }
  .row-chip span {
    font-family: "Arial Rounded MT Bold", -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang TC", sans-serif;
    font-size: 26px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .row-input {
    width: 120px;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 12px;
    border: 1.5px solid var(--ink);
    background: var(--surface);
    color: var(--ink);
    outline: none;
    min-height: 48px;
  }
  .mic-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1.5px solid var(--hairline);
    background: var(--surface);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .mic-btn.on {
    background: var(--yellow);
    border-color: var(--yellow);
  }

  /* ---------- counter display ---------- */
  .display {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 0;
  }
  .count-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  #countInput {
    width: 320px;
    max-width: 82vw;
    text-align: center;
    font-family: "Arial Rounded MT Bold", -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang TC", sans-serif;
    font-size: 128px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    border: none;
    background: transparent;
    color: var(--ink);
    padding: 0;
    margin: 0;
    outline: none;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  #countInput::-webkit-outer-spin-button,
  #countInput::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #countInput.hit { color: var(--red); }
  .count-label {
    font-size: 17px;
    color: var(--muted);
    letter-spacing: 0.1em;
    font-weight: 600;
  }
  @media (prefers-reduced-motion: no-preference) {
    .pulse { animation: pulse 0.18s ease-out; }
    @keyframes pulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  }

  /* ---------- status ---------- */
  .voice-status {
    min-height: 22px;
    font-size: 14px;
    color: var(--muted);
    text-align: center;
  }
  .voice-status .heard { color: var(--ink); font-weight: 700; }
  .voice-status .err { color: var(--red); }

  /* ---------- custom rule + direction ---------- */
  .multi-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    min-height: 40px;
    padding-bottom: 4px;
  }
  .multi-pill {
    border: 1.5px solid var(--hairline);
    background: var(--surface);
    color: var(--ink);
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    padding: 8px 18px;
    min-height: 40px;
    cursor: pointer;
    touch-action: manipulation;
    max-width: 60vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .multi-pill.on {
    background: var(--yellow);
    border-color: var(--yellow);
  }
  .multi-input {
    width: 200px;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 999px;
    border: 1.5px solid var(--ink);
    background: var(--surface);
    color: var(--ink);
    outline: none;
  }

  /* ---------- controls ---------- */
  .controls {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 12px 0 20px;
  }
  .btn {
    border: none;
    border-radius: 20px;
    font-size: 17px;
    font-weight: 700;
    min-height: 56px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--ink);
    transition: transform 0.05s;
    touch-action: manipulation;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--ink);
    color: var(--cream);
    font-size: 26px;
    min-height: 76px;
    border-radius: 24px;
  }
  .btn-row { display: flex; gap: 12px; }
  .btn-row .btn { flex: 1; }
  .btn-blue { background: var(--blue); }
  .btn-pink { background: var(--pink); }
  .btn-pink.confirming { background: var(--red); color: #FFFFFF; }

  /* ---------- footer ---------- */
  .hint {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    padding-bottom: 26px;
    line-height: 1.7;
  }
  .lang-select {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    background: var(--ink);
    color: var(--cream);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    padding: 7px 14px;
    margin-left: 6px;
    text-align: center;
  }
  .version {
    position: fixed;
    right: 14px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
    font-size: 11px;
    color: var(--muted);
    opacity: 0.75;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="left-col">
    <div class="row-area">
      <button class="row-chip" id="rowBtn" aria-label="修改針數">針 <span id="rowVal">0</span></button>
      <input class="row-input" id="rowInput" type="number" inputmode="numeric" min="0" placeholder="針數" style="display:none" aria-label="針數">
    </div>
    <div class="dir-switch" role="group" aria-label="針數遞增或遞減">
      <button class="dir-key on" id="dirUp" aria-label="針遞增">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 4.5 L18.5 12.5 H14.5 V19 H9.5 V12.5 H5.5 Z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <div class="dir-divider"></div>
      <button class="dir-key" id="dirDown" aria-label="針遞減">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19.5 L5.5 11.5 H9.5 V5 H14.5 V11.5 H18.5 Z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
  <button class="mic-btn" id="micBtn" aria-label="聲控開關" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="9" y="2.5" width="6" height="11" rx="3"/>
      <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/>
      <path d="M12 18v3.5"/>
    </svg>
  </button>
</div>

<div class="display">
  <div class="count-wrap" id="countWrap">
    <input id="countInput" type="number" inputmode="numeric" min="0" value="0" aria-label="目前行數">
    <div class="count-label">行</div>
  </div>
  <div class="voice-status" id="voiceStatus">聲控關閉</div>
</div>

<div class="multi-row">
  <button class="multi-pill" id="multiBtn">自定義提示：關</button>
  <input class="multi-input" id="multiInput" type="text" placeholder="5 / 10,25,40 / 3+6" style="display:none" aria-label="自定義提示規則">
</div>

<div class="controls">
  <button class="btn btn-primary" id="plusBtn">＋1</button>
  <div class="btn-row">
    <button class="btn btn-blue" id="minusBtn">−1</button>
    <button class="btn btn-pink" id="resetBtn">重設</button>
  </div>
</div>

<div class="hint">
  點數字改行數 · 點「針」改針數 · 聲控：「加一」「減一」「重設」<br>
  自定義提示：5＝5 的倍數 · 10,25,40＝指定數字 · 3+6＝第 3 行起每 6 行
  <select class="lang-select" id="langSelect" aria-label="聲控語言">
    <option value="zh-HK">廣東話</option>
    <option value="zh-TW">國語</option>
    <option value="en-US">English</option>
  </select>
</div>

<div class="version">v4</div>

<script>
(function () {
  'use strict';

  var countInput = document.getElementById('countInput');
  var countWrap = document.getElementById('countWrap');
  var plusBtn = document.getElementById('plusBtn');
  var minusBtn = document.getElementById('minusBtn');
  var resetBtn = document.getElementById('resetBtn');
  var micBtn = document.getElementById('micBtn');
  var voiceStatus = document.getElementById('voiceStatus');
  var langSelect = document.getElementById('langSelect');
  var multiBtn = document.getElementById('multiBtn');
  var multiInput = document.getElementById('multiInput');
  var dirUp = document.getElementById('dirUp');
  var dirDown = document.getElementById('dirDown');
  var rowBtn = document.getElementById('rowBtn');
  var rowInput = document.getElementById('rowInput');
  var rowVal = document.getElementById('rowVal');

  /* ---------- state ---------- */
  var count = 0;
  try {
    var saved = localStorage.getItem('knitCount');
    if (saved !== null && !isNaN(parseInt(saved, 10))) count = Math.max(0, parseInt(saved, 10));
  } catch (e) {}

  /* ---------- custom highlight rule ----------
     5        → 5 的倍數（5, 10, 15…）
     10,25,40 → 指定數字
     3+6      → 由 3 開始，之後每隔 6（3, 9, 15…） */
  var ruleStr = '';
  var rule = null;
  try {
    ruleStr = localStorage.getItem('knitRule') || '';
    if (!ruleStr) {
      var legacy = parseInt(localStorage.getItem('knitMultiple'), 10);
      if (legacy >= 2) ruleStr = String(legacy);
    }
  } catch (e) {}

  function parseRule(str) {
    var s = String(str || '').trim();
    if (!s) return null;
    var m = s.match(/^(\d+)\s*[+＋/／]\s*(\d+)$/);
    if (m) {
      var start = parseInt(m[1], 10), step = parseInt(m[2], 10);
      if (start > 0 && step >= 1) return { type: 'offset', start: start, step: step };
      return null;
    }
    var parts = s.split(/[,，、\s]+/).filter(function (p) { return p !== ''; });
    if (parts.length > 1) {
      var nums = [];
      for (var i = 0; i < parts.length; i++) {
        var v = parseInt(parts[i], 10);
        if (!isNaN(v) && v > 0) nums.push(v);
      }
      return nums.length ? { type: 'list', nums: nums } : null;
    }
    var n = parseInt(s, 10);
    if (!isNaN(n) && n >= 2) return { type: 'multiple', n: n };
    return null;
  }
  rule = parseRule(ruleStr);

  function isHit(c) {
    if (!rule || c <= 0) return false;
    if (rule.type === 'multiple') return c % rule.n === 0;
    if (rule.type === 'offset') return c >= rule.start && (c - rule.start) % rule.step === 0;
    return rule.nums.indexOf(c) !== -1;
  }

  /* ---------- 針數（左上角，隨規則遞增減） ---------- */
  var startRow = 0;
  var rowDir = 'up';
  try {
    var sr = parseInt(localStorage.getItem('knitStartRow'), 10);
    if (!isNaN(sr)) startRow = sr;
    if (localStorage.getItem('knitRowDir') === 'down') rowDir = 'down';
  } catch (e) {}

  function hitsUpTo(c) {
    if (!rule || c <= 0) return 0;
    if (rule.type === 'multiple') return Math.floor(c / rule.n);
    if (rule.type === 'offset') return c >= rule.start ? Math.floor((c - rule.start) / rule.step) + 1 : 0;
    var k = 0;
    for (var i = 0; i < rule.nums.length; i++) {
      if (rule.nums[i] <= c) k++;
    }
    return k;
  }

  function currentRow() {
    var h = hitsUpTo(count);
    var v = rowDir === 'down' ? startRow - h : startRow + h;
    return Math.max(0, v); /* 遞減到底後繼續顯示 0，不出現負數 */
  }

  function renderRow() {
    rowVal.textContent = String(currentRow());
  }

  function renderDir() {
    dirUp.classList.toggle('on', rowDir !== 'down');
    dirDown.classList.toggle('on', rowDir === 'down');
  }

  /* ---------- render ---------- */
  function render() {
    countInput.value = String(count);
    var len = String(count).length;
    countInput.style.fontSize = len <= 3 ? '128px' : (len === 4 ? '96px' : '72px');
    if (isHit(count)) {
      countInput.classList.add('hit');
    } else {
      countInput.classList.remove('hit');
    }
    renderRow();
    try { localStorage.setItem('knitCount', String(count)); } catch (e) {}
  }

  function setCount(n) {
    count = Math.max(0, Math.floor(n) || 0);
    render();
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: no-preference)').matches) {
      countWrap.classList.remove('pulse');
      void countWrap.offsetWidth;
      countWrap.classList.add('pulse');
    }
  }

  plusBtn.addEventListener('click', function () { setCount(count + 1); });
  minusBtn.addEventListener('click', function () { setCount(count - 1); });

  /* ---------- reset（雙重確認） ---------- */
  var resetTimer = null;
  resetBtn.addEventListener('click', function () {
    if (resetBtn.classList.contains('confirming')) {
      clearTimeout(resetTimer);
      resetBtn.classList.remove('confirming');
      resetBtn.textContent = '重設';
      setCount(0);
    } else {
      resetBtn.classList.add('confirming');
      resetBtn.textContent = '確認重設？';
      resetTimer = setTimeout(function () {
        resetBtn.classList.remove('confirming');
        resetBtn.textContent = '重設';
      }, 3000);
    }
  });

  countInput.addEventListener('change', function () {
    var v = parseInt(countInput.value, 10);
    if (isNaN(v) || v < 0) v = 0;
    setCount(v);
    countInput.blur();
  });

  /* ---------- 針數手動設定 ---------- */
  rowBtn.addEventListener('click', function () {
    rowBtn.style.display = 'none';
    rowInput.style.display = 'block';
    rowInput.value = String(currentRow());
    rowInput.focus();
  });

  function closeRowInput(save) {
    if (save) {
      var v = parseInt(rowInput.value, 10);
      if (isNaN(v) || v < 0) v = 0;
      /* 輸入的是目前針數，反推起始值，之後遞增減邏輯不變 */
      var h = hitsUpTo(count);
      startRow = rowDir === 'down' ? v + h : v - h;
      try { localStorage.setItem('knitStartRow', String(startRow)); } catch (e) {}
      render();
    }
    rowInput.style.display = 'none';
    rowInput.blur();
    rowBtn.style.display = '';
  }

  rowInput.addEventListener('change', function () { closeRowInput(true); });
  rowInput.addEventListener('blur', function () { closeRowInput(false); });

  /* ---------- 針數方向切換 ---------- */
  function setRowDir(dir) {
    if (rowDir === dir) return;
    rowDir = dir;
    try { localStorage.setItem('knitRowDir', rowDir); } catch (e) {}
    renderDir();
    render();
  }
  dirUp.addEventListener('click', function () { setRowDir('up'); });
  dirDown.addEventListener('click', function () { setRowDir('down'); });

  /* ---------- 自定義提示規則 ---------- */
  function renderMultiple() {
    if (rule) {
      multiBtn.textContent = '自定義提示：' + ruleStr;
      multiBtn.classList.add('on');
    } else {
      multiBtn.textContent = '自定義提示：關';
      multiBtn.classList.remove('on');
    }
  }

  multiBtn.addEventListener('click', function () {
    multiBtn.style.display = 'none';
    multiInput.style.display = 'block';
    multiInput.value = rule ? ruleStr : '';
    multiInput.focus();
  });

  function closeMultiInput(save) {
    if (save) {
      var parsed = parseRule(multiInput.value);
      ruleStr = parsed ? String(multiInput.value).trim() : '';
      rule = parsed;
      try { localStorage.setItem('knitRule', ruleStr); } catch (e) {}
      renderMultiple();
      render();
    }
    multiInput.style.display = 'none';
    multiInput.blur();
    multiBtn.style.display = '';
  }

  multiInput.addEventListener('change', function () { closeMultiInput(true); });
  multiInput.addEventListener('blur', function () { closeMultiInput(false); });

  render();
  renderMultiple();
  renderDir();

  /* ---------- keep screen awake ---------- */
  var wakeLock = null;
  function keepAwake() {
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').then(function (wl) { wakeLock = wl; }).catch(function () {});
    }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') keepAwake();
  });
  keepAwake();

  /* ---------- voice control ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null;
  var wantListening = false;
  var isRunning = false;
  var firedThisSession = false;

  function setStatus(html) {
    voiceStatus.innerHTML = html;
  }

  function normalize(rawText) {
    return String(rawText || '').toLowerCase().replace(/[\s，。！？!?,\.]/g, '');
  }

  function matchCommand(t) {
    if (!t) return null;
    var plusWords = ['加一', '加1', '加', '一', '多一', 'next', 'plus', 'add', 'one', '+1'];
    var minusWords = ['減一', '減1', '減', '少一', 'minus', 'back', 'undo'];
    var resetWords = ['重設', '清零', '歸零', 'reset', 'clear', 'zero'];
    var i;
    for (i = 0; i < resetWords.length; i++) {
      if (t.indexOf(resetWords[i]) !== -1) return 'reset';
    }
    for (i = 0; i < minusWords.length; i++) {
      if (t.indexOf(minusWords[i]) !== -1) return 'minus';
    }
    for (i = 0; i < plusWords.length; i++) {
      if (t.indexOf(plusWords[i]) !== -1) return 'plus';
    }
    return null;
  }

  function fireCommand(cmd, rawText) {
    setStatus('聽到：<span class="heard">' + String(rawText).replace(/</g, '&lt;') + '</span>');
    if (cmd === 'reset') setCount(0);
    else if (cmd === 'minus') setCount(count - 1);
    else setCount(count + 1);
  }

  function startRec() {
    if (!rec || isRunning) return;
    firedThisSession = false;
    try {
      rec.start();
      isRunning = true;
    } catch (e) {}
  }

  function stopRec() {
    wantListening = false;
    if (rec && isRunning) {
      try { rec.stop(); } catch (e) {}
    }
    isRunning = false;
    micBtn.classList.remove('on');
    micBtn.setAttribute('aria-pressed', 'false');
    setStatus('聲控關閉');
  }

  function initRec() {
    rec = new SR();
    rec.lang = langSelect.value;
    rec.continuous = false; /* iOS Safari 對 continuous 支援不穩，改用自動重啟 */
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onresult = function (ev) {
      var latest = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        latest = ev.results[i][0].transcript;
        var cmd = matchCommand(normalize(latest));
        if (cmd && !firedThisSession) {
          firedThisSession = true;
          fireCommand(cmd, latest);
          /* 觸發後立即中止本段，onend 會自動重啟，免除等待靜音判定 */
          try { rec.abort(); } catch (e) {}
          return;
        }
      }
      if (latest) {
        setStatus('���識中：<span class="heard">' + String(latest).replace(/</g, '&lt;') + '</span>');
      }
    };
    rec.onend = function () {
      isRunning = false;
      if (wantListening) {
        setTimeout(startRec, 250);
      }
    };
    rec.onerror = function (ev) {
      isRunning = false;
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        wantListening = false;
        micBtn.classList.remove('on');
        setStatus('<span class="err">咪高峰權限被拒，請在 Safari 設定允許</span>');
      } else if (ev.error === 'no-speech') {
        if (wantListening) setTimeout(startRec, 300);
      } else {
        if (wantListening) setTimeout(startRec, 500);
      }
    };
  }

  if (!SR) {
    micBtn.style.display = 'none';
    setStatus('<span class="err">此瀏覽器不支援語音辨識，請用 Safari 開啟</span>');
  }

  micBtn.addEventListener('click', function () {
    if (!SR) return;
    if (wantListening) {
      stopRec();
      return;
    }
    if (!rec) initRec();
    wantListening = true;
    micBtn.classList.add('on');
    micBtn.setAttribute('aria-pressed', 'true');
    setStatus('聆聽中… 講「加一」即加 1');
    startRec();
  });

  langSelect.addEventListener('change', function () {
    if (rec) rec.lang = langSelect.value;
    if (wantListening) {
      try { rec.stop(); } catch (e) {}
      isRunning = false;
      setTimeout(startRec, 300);
    }
  });
})();
</script>
</body>
</html>
