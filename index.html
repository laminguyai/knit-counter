<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F2E4">
<title>針織計數器</title>
<style>
  :root {
    --cream: #F7F2E4;
    --ink: #201D17;
    --muted: #8B8574;
    --ring-empty: #EAE3CF;
    --yellow: #F2E35C;
    --green: #A9BC6B;
    --pink: #F2BFDC;
    --blue: #AFCDF3;
    --surface: #FCFAF2;
    --hairline: #E5DEC9;
    --red: #C64B57;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang HK", "PingFang TC", sans-serif;
    background: var(--cream);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
  }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0 4px;
  }
  .title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.01em;
  }
  .mic-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1.5px solid var(--hairline);
    background: var(--surface);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .mic-btn.on {
    background: var(--yellow);
    border-color: var(--yellow);
  }

  /* ---------- ring display ---------- */
  .display {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 0;
  }
  .ring-wrap {
    position: relative;
    width: min(78vw, 330px);
    aspect-ratio: 1 / 1;
  }
  .ring-wrap svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  #countInput {
    width: 230px;
    text-align: center;
    font-family: "Arial Rounded MT Bold", -apple-system, BlinkMacSystemFont, "PingFang HK", "PingFang TC", sans-serif;
    font-size: 88px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    border: none;
    background: transparent;
    color: var(--ink);
    padding: 0;
    margin: 0;
    outline: none;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  #countInput::-webkit-outer-spin-button,
  #countInput::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .count-label {
    font-size: 15px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }
  @media (prefers-reduced-motion: no-preference) {
    .pulse { animation: pulse 0.18s ease-out; }
    @keyframes pulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  }

  /* ---------- status ---------- */
  .status-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-height: 44px;
  }
  .lap-text {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    background: var(--surface);
    border: 1.5px solid var(--hairline);
    border-radius: 999px;
    padding: 3px 12px;
    display: none;
  }
  .voice-status {
    font-size: 14px;
    color: var(--muted);
    text-align: center;
  }
  .voice-status .heard { color: var(--ink); font-weight: 700; }
  .voice-status .err { color: var(--red); }

  /* ---------- controls ---------- */
  .controls {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 12px 0 20px;
  }
  .btn {
    border: none;
    border-radius: 20px;
    font-size: 17px;
    font-weight: 700;
    min-height: 56px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--ink);
    transition: transform 0.05s;
    touch-action: manipulation;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--ink);
    color: var(--cream);
    font-size: 26px;
    min-height: 76px;
    border-radius: 24px;
  }
  .btn-row { display: flex; gap: 12px; }
  .btn-row .btn { flex: 1; }
  .btn-blue { background: var(--blue); }
  .btn-pink { background: var(--pink); }

  /* ---------- footer ---------- */
  .hint {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    padding-bottom: 8px;
    line-height: 1.7;
  }
  .lang-select {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    background: var(--ink);
    color: var(--cream);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    padding: 7px 14px;
    margin-left: 6px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="title">針織計數器</div>
  <button class="mic-btn" id="micBtn" aria-label="聲控開關" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="9" y="2.5" width="6" height="11" rx="3"/>
      <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/>
      <path d="M12 18v3.5"/>
    </svg>
  </button>
</div>

<div class="display">
  <div class="ring-wrap" id="countWrap">
    <svg id="ringSvg" viewBox="0 0 320 320" aria-hidden="true"></svg>
    <div class="ring-center">
      <input id="countInput" type="number" inputmode="numeric" min="0" value="0" aria-label="目前針數">
      <div class="count-label">行／針</div>
    </div>
  </div>
  <div class="status-col">
    <div class="lap-text" id="lapText"></div>
    <div class="voice-status" id="voiceStatus">聲控關閉</div>
  </div>
</div>

<div class="controls">
  <button class="btn btn-primary" id="plusBtn">＋1</button>
  <div class="btn-row">
    <button class="btn btn-blue" id="minusBtn">−1</button>
    <button class="btn btn-pink" id="resetBtn">重設</button>
  </div>
</div>

<div class="hint">
  點數字可直接輸入 · 聲控：「加一」＋1 ·「減一」−1 ·「重設」歸零
  <select class="lang-select" id="langSelect" aria-label="聲控語言">
    <option value="zh-HK">廣東話</option>
    <option value="zh-TW">國語</option>
    <option value="en-US">English</option>
  </select>
</div>

<script>
(function () {
  'use strict';

  var countInput = document.getElementById('countInput');
  var countWrap = document.getElementById('countWrap');
  var plusBtn = document.getElementById('plusBtn');
  var minusBtn = document.getElementById('minusBtn');
  var resetBtn = document.getElementById('resetBtn');
  var micBtn = document.getElementById('micBtn');
  var voiceStatus = document.getElementById('voiceStatus');
  var langSelect = document.getElementById('langSelect');
  var lapText = document.getElementById('lapText');
  var ringSvg = document.getElementById('ringSvg');

  /* ---------- progress ring ---------- */
  var CX = 160, CY = 160, R = 116;
  var ARC_SPAN = 75;           /* 每段 75°，間隔 15° */
  var COLORS = ['#F2E35C', '#A9BC6B', '#F2BFDC', '#AFCDF3'];
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var fillPaths = [];

  function polar(a) {
    var rad = a * Math.PI / 180;
    return [CX + R * Math.cos(rad), CY + R * Math.sin(rad)];
  }
  function arcPath(a0, a1) {
    var p0 = polar(a0), p1 = polar(a1);
    return 'M ' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) +
           ' A ' + R + ' ' + R + ' 0 0 1 ' +
           p1[0].toFixed(2) + ' ' + p1[1].toFixed(2);
  }
  function makePath(stroke) {
    var p = document.createElementNS(SVG_NS, 'path');
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', stroke);
    p.setAttribute('stroke-width', '26');
    p.setAttribute('stroke-linecap', 'round');
    ringSvg.appendChild(p);
    return p;
  }
  (function buildRing() {
    for (var i = 0; i < 4; i++) {
      var start = -90 + i * 90;
      var base = makePath('#EAE3CF');
      base.setAttribute('d', arcPath(start, start + ARC_SPAN));
      var fill = makePath(COLORS[i]);
      fill.setAttribute('d', arcPath(start, start)); /* 初始隱藏 */
      fill.style.visibility = 'hidden';
      fillPaths.push({ el: fill, start: start });
    }
  })();

  function updateRing() {
    var p = (count % 10) / 10; /* 每 10 行一圈 */
    for (var i = 0; i < 4; i++) {
      var frac = Math.min(Math.max(p * 4 - i, 0), 1);
      var fp = fillPaths[i];
      if (frac <= 0.004) {
        fp.el.style.visibility = 'hidden';
      } else {
        fp.el.style.visibility = 'visible';
        fp.el.setAttribute('d', arcPath(fp.start, fp.start + ARC_SPAN * frac));
      }
    }
  }

  /* ---------- state ---------- */
  var count = 0;
  try {
    var saved = localStorage.getItem('knitCount');
    if (saved !== null && !isNaN(parseInt(saved, 10))) count = Math.max(0, parseInt(saved, 10));
  } catch (e) {}

  function render() {
    countInput.value = String(count);
    var len = String(count).length;
    countInput.style.fontSize = len <= 3 ? '88px' : (len === 4 ? '66px' : '52px');
    if (count >= 10) {
      lapText.textContent = '已完成 ' + Math.floor(count / 10) + ' 圈（每圈 10）';
      lapText.style.display = 'block';
    } else {
      lapText.style.display = 'none';
    }
    updateRing();
    try { localStorage.setItem('knitCount', String(count)); } catch (e) {}
  }

  function setCount(n) {
    count = Math.max(0, Math.floor(n) || 0);
    render();
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: no-preference)').matches) {
      countWrap.classList.remove('pulse');
      void countWrap.offsetWidth;
      countWrap.classList.add('pulse');
    }
  }

  plusBtn.addEventListener('click', function () { setCount(count + 1); });
  minusBtn.addEventListener('click', function () { setCount(count - 1); });
  resetBtn.addEventListener('click', function () { setCount(0); });

  countInput.addEventListener('change', function () {
    var v = parseInt(countInput.value, 10);
    if (isNaN(v) || v < 0) v = 0;
    setCount(v);
    countInput.blur();
  });

  render();

  /* ---------- keep screen awake ---------- */
  var wakeLock = null;
  function keepAwake() {
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').then(function (wl) { wakeLock = wl; }).catch(function () {});
    }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') keepAwake();
  });
  keepAwake();

  /* ---------- voice control ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null;
  var wantListening = false;
  var isRunning = false;

  function setStatus(html) {
    voiceStatus.innerHTML = html;
  }

  function handleCommand(rawText) {
    var t = String(rawText || '').toLowerCase().replace(/[\s，。！？!?,\.]/g, '');
    if (!t) return;
    setStatus('聽到：<span class="heard">' + String(rawText).replace(/</g, '&lt;') + '</span>');

    var plusWords = ['加一', '加1', '加', '一', '多一', 'next', 'plus', 'add', 'one', '+1'];
    var minusWords = ['減一', '減1', '減', '少一', 'minus', 'back', 'undo'];
    var resetWords = ['重設', '清零', '歸零', 'reset', 'clear', 'zero'];

    var i;
    for (i = 0; i < resetWords.length; i++) {
      if (t.indexOf(resetWords[i]) !== -1) { setCount(0); return; }
    }
    for (i = 0; i < minusWords.length; i++) {
      if (t.indexOf(minusWords[i]) !== -1) { setCount(count - 1); return; }
    }
    for (i = 0; i < plusWords.length; i++) {
      if (t.indexOf(plusWords[i]) !== -1) { setCount(count + 1); return; }
    }
  }

  function startRec() {
    if (!rec || isRunning) return;
    try {
      rec.start();
      isRunning = true;
    } catch (e) {}
  }

  function stopRec() {
    wantListening = false;
    if (rec && isRunning) {
      try { rec.stop(); } catch (e) {}
    }
    isRunning = false;
    micBtn.classList.remove('on');
    micBtn.setAttribute('aria-pressed', 'false');
    setStatus('聲控關閉');
  }

  function initRec() {
    rec = new SR();
    rec.lang = langSelect.value;
    rec.continuous = false; /* iOS Safari 對 continuous 支援不穩，改用自動重啟 */
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onresult = function (ev) {
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) {
          handleCommand(ev.results[i][0].transcript);
        }
      }
    };
    rec.onend = function () {
      isRunning = false;
      if (wantListening) {
        setTimeout(startRec, 250);
      }
    };
    rec.onerror = function (ev) {
      isRunning = false;
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        wantListening = false;
        micBtn.classList.remove('on');
        setStatus('<span class="err">咪高峰權限被拒，請在 Safari 設定允許</span>');
      } else if (ev.error === 'no-speech') {
        if (wantListening) setTimeout(startRec, 300);
      } else {
        if (wantListening) setTimeout(startRec, 500);
      }
    };
  }

  if (!SR) {
    micBtn.style.display = 'none';
    setStatus('<span class="err">此瀏覽器不支援語音辨識，請用 Safari 開啟</span>');
  }

  micBtn.addEventListener('click', function () {
    if (!SR) return;
    if (wantListening) {
      stopRec();
      return;
    }
    if (!rec) initRec();
    wantListening = true;
    micBtn.classList.add('on');
    micBtn.setAttribute('aria-pressed', 'true');
    setStatus('聆聽中… 講「加一」即加 1');
    startRec();
  });

  langSelect.addEventListener('change', function () {
    if (rec) rec.lang = langSelect.value;
    if (wantListening) {
      try { rec.stop(); } catch (e) {}
      isRunning = false;
      setTimeout(startRec, 300);
    }
  });
})();
</script>
</body>
</html>
